# 改善エージェントの PR の自動マージ判定(docs/05 §5)。
# CI が PR で成功したら起動する。PR のコードは実行しない(main のスクリプトで差分を判定するだけ)。
#
# GITHUB_TOKEN で行ったマージは push イベントでワークフローを起動しないので、
# マージ後に deploy.yml を workflow_dispatch で明示的に起動する(docs/05 §13 N-6)。
name: Kaizen gate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: kaizen-gate
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  gate:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      # main(信頼できるコード)をチェックアウトする。PR 側のコードは実行しない。
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: find PR
        id: pr
        run: |
          pr=$(gh pr list --state open --head "$HEAD_BRANCH" --json number,headRefOid,baseRefOid,labels,author \
               --jq "map(select(.headRefOid == \"$HEAD_SHA\")) | .[0]")
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "::notice::HEAD $HEAD_SHA の開いた PR がありません(古いコミットの CI か、すでに閉じた PR)"
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$pr" | jq -r .number)" >> "$GITHUB_OUTPUT"
          echo "base=$(echo "$pr" | jq -r .baseRefOid)" >> "$GITHUB_OUTPUT"
          login=$(echo "$pr" | jq -r .author.login)
          # gh は App の作者を "app/claude" のように返すことがあるので、[bot] 表記に揃える
          case "$login" in app/*) login="${login#app/}[bot]";; esac
          echo "author=$login" >> "$GITHUB_OUTPUT"
          echo "labels=$(echo "$pr" | jq -r '[.labels[].name] | join(",")')" >> "$GITHUB_OUTPUT"

      - name: classify
        id: class
        if: steps.pr.outputs.found == 'true' && contains(steps.pr.outputs.labels, 'kaizen')
        env:
          KAIZEN_BOT_LOGINS: ${{ vars.KAIZEN_BOT_LOGINS }}
        run: |
          git fetch origin "$HEAD_SHA"
          set +e
          npx tsx scripts/change-class.ts --base "${{ steps.pr.outputs.base }}" --head "$HEAD_SHA" \
            --author "${{ steps.pr.outputs.author }}" --labels "${{ steps.pr.outputs.labels }}" --json class.json
          echo "violations=$?" >> "$GITHUB_OUTPUT"
          echo "class=$(jq -r .class class.json)" >> "$GITHUB_OUTPUT"
          echo "automerge=$(jq -r .automerge class.json)" >> "$GITHUB_OUTPUT"
          echo "reasons=$(jq -r '.reasons + .violations | join(" / ")' class.json)" >> "$GITHUB_OUTPUT"

      - name: label
        if: steps.class.outputs.class != ''
        run: |
          n=${{ steps.pr.outputs.number }}
          gh label create "class:${{ steps.class.outputs.class }}" --color 9DB0B0 --force
          gh pr edit "$n" --add-label "class:${{ steps.class.outputs.class }}"

      - name: merge
        id: merge
        if: steps.class.outputs.automerge == 'true' && vars.KAIZEN_AUTOMERGE == 'true'
        run: |
          gh pr merge ${{ steps.pr.outputs.number }} --squash --delete-branch --match-head-commit "$HEAD_SHA"
          gh workflow run deploy.yml --ref main
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: needs human
        if: steps.class.outputs.class != '' && steps.merge.outputs.merged != 'true'
        run: |
          n=${{ steps.pr.outputs.number }}
          gh label create needs-human --color D96C5F --force
          gh pr edit "$n" --add-label needs-human
          reason="${{ steps.class.outputs.reasons }}"
          if [ "${{ vars.KAIZEN_AUTOMERGE }}" != "true" ]; then reason="KAIZEN_AUTOMERGE が true ではない / $reason"; fi
          marker="<!-- kaizen-gate:$HEAD_SHA -->"
          if ! gh pr view "$n" --json comments --jq '.comments[].body' | grep -qF "$marker"; then
            gh pr comment "$n" --body "$(printf '%s\n自動マージしませんでした(クラス: `%s`)。理由: %s' "$marker" "${{ steps.class.outputs.class }}" "$reason")"
          fi
