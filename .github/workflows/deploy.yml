# 本番デプロイ(docs/02 §8、docs/05 §7.4)。main への push で Cloudflare Workers へ。
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "kaizen/**"
      - "**/*.md"
  workflow_dispatch:

# デプロイの追い越しを防ぐ
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.secrets.outputs.ok }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: check secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定なのでデプロイしません(docs/07 §0 H2〜H3)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci

      # 壊れたものを本番へ出さない最後の関門
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run check
      - if: steps.secrets.outputs.ok == 'true'
        run: npm test

      - if: steps.secrets.outputs.ok == 'true'
        name: deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_SHA: ${{ github.sha }}
        run: |
          export GIT_SHA="${GIT_SHA:0:7}"
          npm run deploy | tee deploy.log
          url="${{ vars.PUBLIC_URL }}"
          if [ -z "$url" ]; then
            url=$(grep -oE "https://hamaru\.[a-z0-9-]+\.workers\.dev" deploy.log | head -1 || true)
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - if: steps.secrets.outputs.ok == 'true'
        name: health check
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$URL" ]; then echo "::error::公開 URL が分かりません(vars.PUBLIC_URL を設定してください)"; exit 1; fi
          for i in $(seq 1 20); do
            body=$(curl -fsS "$URL/api/health" || true)
            if echo "$body" | grep -q "\"version\":\"${SHA:0:7}\""; then
              echo "health OK: $body"
              curl -fsS "$URL/" | grep -q "<title>HAMARU" && echo "top page OK" && exit 0
            fi
            sleep 6
          done
          echo "::error::ヘルスチェックに失敗しました: $URL/api/health → $body"
          exit 1
