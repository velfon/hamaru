# 本番デプロイ(docs/02 §8、docs/05 §7.4)。main への push で Cloudflare Workers へ。
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "kaizen/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# シェルを明示すると GitHub は bash -eo pipefail で実行する(省略時は -e だけで、`cmd | tee` の失敗を見逃す)
defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # デプロイの追い越しを防ぐ。ジョブ単位にして、canary の 30 分待ちが次のデプロイを止めないようにする
    concurrency:
      group: deploy-job
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.secrets.outputs.ok }}
      url: ${{ steps.deploy.outputs.url }}
      deployed_at: ${{ steps.deploy.outputs.deployed_at }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: check secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定なのでデプロイしません(docs/07 §0 H2〜H3)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci

      # 壊れたものを本番へ出さない最後の関門
      - if: steps.secrets.outputs.ok == 'true'
        run: npm run check
      - if: steps.secrets.outputs.ok == 'true'
        run: npm test

      - if: steps.secrets.outputs.ok == 'true'
        name: deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_SHA: ${{ github.sha }}
        run: |
          export GIT_SHA="${GIT_SHA:0:7}"
          npm run deploy | tee deploy.log
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          url="${{ vars.PUBLIC_URL }}"
          if [ -z "$url" ]; then
            url=$(grep -oE "https://hamaru\.[a-z0-9-]+\.workers\.dev" deploy.log | head -1 || true)
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - if: steps.secrets.outputs.ok == 'true'
        name: health check
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$URL" ]; then echo "::error::公開 URL が分かりません(vars.PUBLIC_URL を設定してください)"; exit 1; fi
          for i in $(seq 1 20); do
            body=$(curl -fsS "$URL/api/health" || true)
            if echo "$body" | grep -q "\"version\":\"${SHA:0:7}\""; then
              echo "health OK: $body"
              curl -fsS "$URL/" | grep -q "<title>HAMARU" && echo "top page OK" && exit 0
            fi
            sleep 6
          done
          echo "::error::ヘルスチェックに失敗しました: $URL/api/health → $body"
          exit 1

  # デプロイ後 30 分のエラー率を判定し、急増していれば本番を直前の版に戻す(docs/05 §7.3)。
  # 別ワークフロー(workflow_run)にせず後続ジョブにしたのは、GITHUB_TOKEN 起点の連鎖が起動しない場合があるため
  # (docs/05 §13 N-7)。
  canary:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # 新しいデプロイが来たら古い版の判定はやめる(直近の窓に新旧の版が混ざるため)
    concurrency:
      group: canary
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: wait 30 minutes
        run: sleep 1800
      - name: judge
        id: canary
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run canary -- --since "${{ needs.deploy.outputs.deployed_at }}" --window-minutes 30 --baseline-hours 24
      - name: rollback production
        if: steps.canary.outputs.decision == 'rollback'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler rollback --yes --message "canary rollback ${GITHUB_SHA:0:7}: エラー急増"
      - name: revert PR and issue
        if: steps.canary.outputs.decision == 'rollback'
        env:
          REASON: ${{ steps.canary.outputs.reason }}
        run: |
          short=${GITHUB_SHA:0:7}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="canary/revert-$short"
          git switch -c "$branch"
          if git revert --no-edit "$GITHUB_SHA"; then
            git push -u origin "$branch"
            gh label create revert --color D96C5F --force
            gh label create needs-human --color D96C5F --force
            pr=$(gh pr create --base main --head "$branch" --label revert --label needs-human \
              --title "revert: $short(canary がエラー急増を検知)" \
              --body "$(printf '本番は wrangler rollback で直前の版に戻しました。このコミットを main からも取り除きます。\n\n判定: %s\n\nGITHUB_TOKEN で作った PR なので CI が自動では走りません。確認して close → reopen するか、手元で push してください。' "$REASON")")
          else
            pr="(git revert が衝突したため PR は作れませんでした)"
          fi
          gh issue create --label needs-human --title "canary: auto-rollback $short" \
            --body "$(printf 'デプロイ %s の 30 分後にエラーが急増したため、本番を直前の版に戻しました。\n\n- 判定: %s\n- revert PR: %s\n\n原因の PR には needs-human を付け、同じ変更の再挑戦は禁止です(docs/05 §11)。' "$short" "$REASON" "$pr")"
