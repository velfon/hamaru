<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17262A" />
    <meta name="robots" content="noindex" />
    <title>HAMARU — 404</title>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <style>
      /* 単独で開かれる静的ページなので、トークンの必要な分だけをここに複製する(docs/03 §2)。 */
      :root {
        color-scheme: dark light;
        --kiln: #17262a;
        --ink: #f1ede4;
        --ink-muted: #9db0b0;
        --kintsugi: #e8c170;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --kiln: #eee9df;
          --ink: #22303a;
          --ink-muted: #5d6f75;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: var(--kiln);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Hiragino Sans",
          "Noto Sans JP",
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 44px;
        letter-spacing: 0.08em;
        color: var(--kintsugi);
      }
      p {
        margin: 0;
        color: var(--ink-muted);
        font-size: 16px;
      }
      a {
        color: var(--ink);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>そのページはありません。</p>
    <p><a href="/">HAMARU へ戻る</a></p>
  </body>
</html>
